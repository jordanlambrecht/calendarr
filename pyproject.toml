[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calendarr"
version = "1.5.1"
description = "A Docker container that fetches upcoming airings/releases for TV shows and movies from Sonarr and Radarr calendars and posts them to Discord/Slack on a schedule."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Jordan Lambrecht", email = "me@jordanlambrecht.com" },
]
maintainers = [
  { name = "Jordan Lambrecht", email = "me@jordanlambrecht.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

dependencies = [
    "apscheduler",
    "flask",
    "icalendar",
    "pytz",
    "recurring-ical-events",
    "requests",
]

[project.urls]
Homepage = "https://github.com/jordanlambrecht/calendarr"
Repository = "https://github.com/jordanlambrecht/calendarr"
Issues = "https://github.com/jordanlambrecht/calendarr/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
